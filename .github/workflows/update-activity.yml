name: Update profile activity

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.event.repository.name == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update recent activity
        run: npm run activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Validate before committing, not after. validate.yml only fires on the
      # resulting push, so a blank asset used to reach the profile first and
      # fail second.
      - name: Validate regenerated assets
        run: npm run check

      - name: Commit changes
        run: |
          if git diff --quiet README.md assets/activity; then
            echo "No profile activity changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/activity
          git commit -m "chore: update profile activity"
          git push
